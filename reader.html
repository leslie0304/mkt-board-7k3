<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>原文阅读 · 营销作战板</title>
<link rel="icon" href="favicon-48.png" onerror="this.href='data:,'">
<style>
:root{
  --bg:#f5f7f9; --card:#fff; --ink:#1b232b; --ink2:#4a5560; --mute:#7b8794;
  --line:#e3e8ee; --accent:#0e8c8c; --accent2:#0b6d6d;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12161a; --card:#1a2026; --ink:#e8edf2; --ink2:#b6c2cd; --mute:#8b98a5;
         --line:#2a333c; --accent:#2ec4b6; --accent2:#3ad9ca; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;
}
.top{
  position:sticky; top:0; z-index:20;
  background:var(--card); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.top .back{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); text-decoration:none; font-size:19px; line-height:1;
}
.top .back:active{background:var(--line)}
.top h1{
  margin:0; font-size:15px; font-weight:600; line-height:1.4;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
}
.top .badge{
  flex:none; font-size:11px; color:var(--mute); border:1px solid var(--line);
  border-radius:20px; padding:2px 8px;
}
.wrap{padding:14px 14px 60px; max-width:820px; margin:0 auto}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 16px; margin-bottom:14px; overflow-wrap:break-word; word-break:break-word;
}
.loading,.err,.tip{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 16px; color:var(--ink2); font-size:14px; text-align:center;
}
.err{color:#c0392b;border-color:#f0c9c4}
.tip{font-size:13px;color:var(--mute);text-align:left}
.tip code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
/* ── Markdown 渲染 ── */
.md h1,.md h2,.md h3,.md h4{line-height:1.4;margin:1.4em 0 .6em;font-weight:700}
.md h1{font-size:22px}.md h2{font-size:19px;border-bottom:1px solid var(--line);padding-bottom:6px}
.md h3{font-size:17px}.md h4{font-size:15px}
.md h1:first-child,.md h2:first-child{margin-top:0}
.md p{margin:.75em 0}
.md ul,.md ol{margin:.6em 0;padding-left:1.5em}
.md li{margin:.3em 0}
.md a{color:var(--accent);text-decoration:none;word-break:break-all}
.md strong{font-weight:700}
.md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.md blockquote{
  margin:.9em 0;padding:.6em .9em;border-left:3px solid var(--accent);
  background:var(--bg);border-radius:0 8px 8px 0;color:var(--ink2);
}
.md code{
  background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px;
  font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.md pre{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:12px;overflow-x:auto;margin:.9em 0;
}
.md pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.6}
.md table{
  border-collapse:collapse; margin:1em 0; font-size:14px;
  display:block; width:max-content; min-width:100%; max-width:100%;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  border-radius:10px;
}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--bg);font-weight:600}
.md td{word-break:normal;overflow-wrap:anywhere}
.md td:first-child,.md th:first-child{white-space:nowrap}
.md img{max-width:100%;height:auto;border-radius:8px;margin:.5em 0}
.md .todo{list-style:none;margin-left:-1.2em}
.md .todo input{margin-right:6px}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:20px 0 10px}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html" title="返回作战板">‹</a>
  <h1 id="ttl">加载中…</h1>
  <span class="badge" id="bd">免登录</span>
</div>
<div class="wrap">
  <div class="loading" id="box">正在读取原文…</div>
</div>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var u   = qs.get('u') || '';
  var ttl = qs.get('t') || '';
  var wrap = document.querySelector('.wrap');

  document.getElementById('ttl').textContent = ttl || '原文阅读';

  function fail(html){
    document.getElementById('box').className='err';
    document.getElementById('box').innerHTML = html;
  }

  if(!u){
    fail('缺少参数 u（原文直链）。<br>请从营销作战板条目点击「读全文 ↗」进入。');
    return;
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function inline(s){
    var t = esc(s);
    // 行内代码
    t = t.replace(/`([^`]+)`/g, function(_,c){ return '<code>'+c+'</code>'; });
    // 图片 ![alt](url)
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function(_,a,src){
      return '<img src="'+src+'" alt="'+a+'" loading="lazy">';
    });
    // 粗体 **x** / __x__
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    // 斜体 *x* / _x_
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    // 删除线
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // 链接 [x](url)
    t = t.replace(/\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function(_,x,href){
      return '<a href="'+href+'" target="_blank" rel="noopener">'+x+'</a>';
    });
    // 裸链接
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>"')]+)/g, function(_,p,url){
      return p+'<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>';
    });
    return t;
  }

  /* 轻量 Markdown → HTML（表格 / 列表 / 引用 / 代码块 / 分隔线） */
  function md2html(md){
    md = String(md).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var lines = md.split('\n');
    var out = [], i = 0, inCode = false, codeBuf = [], listStack = [];

    function closeLists(){
      while(listStack.length){ out.push('</'+(listStack.pop()==='ul'?'ul':'ol')+'>'); }
    }
    function cellText(c){ return c.trim().replace(/<br\s*\/?>/gi,'<br>'); }

    while(i < lines.length){
      var L = lines[i];

      /* 代码块 */
      if(/^\s*```/.test(L)){
        if(inCode){
          out.push('<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>');
          codeBuf=[]; inCode=false; i++; continue;
        }
        closeLists(); inCode=true; i++; continue;
      }
      if(inCode){ codeBuf.push(L); i++; continue; }

      /* 表格：当前行含 | 且下一行是分隔行 */
      if(L.indexOf('|')>-1 && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
        closeLists();
        var head = L.split('|').map(cellText);
        if(head.length && !head[0].trim()) head.shift();
        if(head.length && !head[head.length-1].trim()) head.pop();
        i += 2;
        var body = [];
        while(i<lines.length && lines[i].indexOf('|')>-1 && lines[i].trim()){
          var r = lines[i].split('|').map(cellText);
          if(r.length && !r[0].trim()) r.shift();
          if(r.length && !r[r.length-1].trim()) r.pop();
          body.push(r); i++;
        }
        var h = '<table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
        body.forEach(function(r){
          h += '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';
        });
        out.push(h+'</tbody></table>');
        continue;
      }

      /* 标题 */
      var m = L.match(/^(#{1,6})\s+(.*)$/);
      if(m){
        closeLists();
        var lv = Math.min(m[1].length,4);
        out.push('<h'+lv+'>'+inline(m[2])+'</h'+lv+'>');
        i++; continue;
      }

      /* 分隔线 */
      if(/^\s*([-*_])\s*(\1\s*){2,}$/.test(L)){ closeLists(); out.push('<hr>'); i++; continue; }

      /* 引用 */
      if(/^\s*>\s?/.test(L)){
        closeLists();
        var q=[];
        while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
        out.push('<blockquote>'+md2html(q.join('\n'))+'</blockquote>');
        continue;
      }

      /* 列表 */
      var li = L.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if(li){
        var indent = li[1].length;
        var ordered = /\d/.test(li[2]);
        var tag = ordered ? 'ol' : 'ul';
        if(!listStack.length){ listStack.push(tag); out.push('<'+tag+'>'); }
        else if(listStack[listStack.length-1] !== tag){
          out.push('</'+listStack.pop()+'>');
          listStack.push(tag); out.push('<'+tag+'>');
        }
        out.push('<li>'+inline(li[3])+'</li>');
        i++; continue;
      }

      /* 空行 */
      if(!L.trim()){ closeLists(); i++; continue; }

      /* 段落（合并连续非空行） */
      var p=[];
      while(i<lines.length && lines[i].trim() && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])
            && !/^#{1,6}\s+/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^\s*>\s?/.test(lines[i])){
        p.push(lines[i]); i++;
      }
      closeLists();
      out.push('<p>'+inline(p.join(' '))+'</p>');
    }
    if(inCode && codeBuf.length) out.push('<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>');
    closeLists();
    return out.join('\n');
  }

  function render(text){
    var html = md2html(text);
    document.getElementById('box').outerHTML = '<div class="card md">'+html+'</div>';
    var f=document.createElement('div');
    f.className='foot';
    f.innerHTML='营销作战板 · 免登录直读 · <a href="index.html">返回作战板</a>';
    wrap.appendChild(f);
    document.getElementById('bd').textContent = '免登录直读';
    window.scrollTo(0,0);
  }

  fetch(u, {mode:'cors', credentials:'omit'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(function(t){
      if(!t || !t.trim()) throw new Error('空内容');
      render(t);
    })
    .catch(function(e){
      fail('读取失败：'+esc(e.message)+
           '<br><br><span style="font-size:13px;color:#7b8794">该条目可能为 PDF/Excel/Word 等非网页正文，'+
           '或直链需重新生成。可点下方按钮尝试在 IMA 中打开。</span>'+
           '<br><br><a href="'+esc(u)+'" target="_blank" rel="noopener" style="display:inline-block;padding:8px 16px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--ink)">直接打开原始文件 ↗</a>');
    });
})();
</script>
</body>
</html>
